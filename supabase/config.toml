project_id = "tysvpeprhokdijquprkd"

# Webhook do Asaas: chamado pelo provedor, sem JWT. A autenticação é feita
# dentro da função pelo token ASAAS_WEBHOOK_TOKEN.
[functions.asaas-webhook]
verify_jwt = false

# Reprocessamento manual: exige JWT de administradora.
[functions.asaas-webhook-reprocessar]
verify_jwt = true

# Migração do banco antigo: exige JWT de administradora ou x-cron-secret.
[functions.migrar-legado]
verify_jwt = false

# Comunicado em massa: exige JWT e é validado como administradora dentro da função.
[functions.notificar-usuarias]
verify_jwt = false
